name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a bug! Please fill out the sections below."

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g. 3.11.2"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 14.3, Ubuntu 22.04"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. What did you expect vs. what actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install cc-logger
        2. Run a Claude Code session with tool X
        3. See error in logs/
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output (if any)
      description: Paste any error from `.cc-logger-errors.log` or stderr
      render: text
